name: Portable CSharp DXF parser
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build portable parser (no CAD SDK)
        run: dotnet build src/CSharpAdapter/CSharpAdapter.csproj -c Release
      - name: Run 28 CSharp cases on shared DXF fixtures
        run: dotnet test src/CSharpAdapter/Tests/CSharpAdapter.Tests.csproj -c Release --logger "trx;LogFileName=parser.trx" --results-directory TestResults
      - name: Assert exactly 28 passed cases from TRX
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          root = ET.parse('TestResults/parser.trx').getroot()
          counts = next(e for e in root.iter() if e.tag.endswith('}Counters'))
          assert counts.attrib['total'] == '28', counts.attrib
          assert counts.attrib['passed'] == '28', counts.attrib
          assert counts.attrib['failed'] == '0', counts.attrib
          print('TRX verified: 28 passed / 28 total / 0 failed')
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csharp-parser-test-results
          path: TestResults
